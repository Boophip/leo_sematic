# Stage-three deterministic satellite simulation defaults.
# This file belongs to the configs/ experiment-parameter layer; it configures
# reproducible baseline evaluation only, not PPO training or external orbit tools.

paths:
  profile_csv: data/profiling/dota_v1_lite_300_100_100/test_full/roi_profile_smoke.csv
  quality_proxy: outputs/proxy/test_full/quality_proxy.joblib
  output_dir: outputs/simulation/deterministic

run:
  seed: 42
  limit_rois:
  rois_per_slot: 64
  deadline_ms: 500.0
  quality_threshold: 0.5
  use_oracle_quality: false
  scenario: default
  delta_t_s: 1.0

link:
  bandwidth_hz: 20000000.0
  result_bytes: 64
  tx_power_w: 5.0

nodes:
  - name: source
    frequency_cycles_per_s: 2000000000.0
    initial_queue_cycles: 0.0
    energy_per_cycle_j: 0.000000001
  - name: sat_1
    frequency_cycles_per_s: 2500000000.0
    initial_queue_cycles: 0.0
    energy_per_cycle_j: 0.000000001
  - name: sat_2
    frequency_cycles_per_s: 1800000000.0
    initial_queue_cycles: 0.0
    energy_per_cycle_j: 0.0000000012

reward:
  quality_weight: 1.0
  delay_weight: 0.15
  energy_weight: 0.05
  aosi_weight: 0.05
  illegal_penalty: 1.0
  timeout_penalty: 0.2
  quality_penalty: 0.2
  delay_ref_ms: 1000.0
  energy_ref_j: 1.0
  aosi_ref: 64.0

aosi:
  alpha: 0.2

policies:
  - Random
  - Local-Deep
  - Local-Adaptive
  - Best-SNR
  - Semantic-Greedy
  - No-AoSI
  - AoSI-Greedy
